---
- name: DHCP-Konfiguration auf R1
  hosts: R1
  become: 'yes'
  tasks:
    - name: Installiere ISC-DHCP-Server
      apt:
        name: isc-dhcp-server
        state: present
        update_cache: 'yes'
    - name: Konfiguriere dhcpd.conf
      copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          option domain-name "corp.example.com";
          option domain-name-servers 192.168.2.1;  # DNS auf Client2
          default-lease-time 600;
          max-lease-time 7200;
          authoritative;
          subnet 192.168.1.0 netmask 255.255.255.0 {
            range 192.168.1.150 192.168.1.200;
            option routers 192.168.1.254;
            option broadcast-address 192.168.1.255;
          }
      notify: Restart DHCP
    - name: Setze Interfaces für DHCP (nur ens37)
      copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="ens37"
      notify: Restart DHCP
  handlers:
    - name: Restart DHCP
      service:
        name: isc-dhcp-server
        state: restarted
