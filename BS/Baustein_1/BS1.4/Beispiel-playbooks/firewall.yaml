- name: Firewall-Konfiguration auf R1 mit UFW
  hosts: R1
  become: 'yes'
  tasks:
    - name: Installiere UFW
      apt:
        name: ufw
        state: present
        update_cache: 'yes'
    - name: Erlaube SSH (für Management)
      ufw:
        rule: allow
        port: 22
        proto: tcp
    - name: Erlaube Traffic aus Netz1 und Netz2 (intern)
      ufw:
        rule: allow
        interface: ens37
        direction: in
    - name: Erlaube Traffic aus Netz2 (intern)
      ufw:
        rule: allow
        interface: ens38
        direction: in
    - name: Beschränke Internet-Interface (z.B. nur ausgehend)
      ufw:
        rule: deny
        interface: ens39
        direction: in
    - name: Erlaube DNS-Traffic von Netz1 zu DNS-Server (UDP)
      ufw:
        rule: allow
        from: 192.168.1.0/24
        to: 192.168.2.1
        port: 53
        proto: udp
        direction: in
        comment: Allow DNS from Netz1 to Client2
    - name: Erlaube DNS-Traffic von Netz1 zu DNS-Server (TCP)
      ufw:
        rule: allow
        from: 192.168.1.0/24
        to: 192.168.2.1
        port: 53
        proto: tcp
        direction: in
        comment: Allow DNS from Netz1 to Client2
    - name: Erlaube DNS-Traffic von Netz2 zu DNS-Server (UDP)
      ufw:
        rule: allow
        from: 192.168.2.0/24
        to: 192.168.2.1
        port: 53
        proto: udp
        direction: in
        comment: Allow DNS from Netz2 to Client2
    - name: Erlaube DNS-Traffic von Netz2 zu DNS-Server (TCP)
      ufw:
        rule: allow
        from: 192.168.2.0/24
        to: 192.168.2.1
        port: 53
        proto: tcp
        direction: in
        comment: Allow DNS from Netz2 to Client2
      notify: Reload UFW
    - name: Erlaube Forwarding in UFW
      lineinfile:
        path: /etc/default/ufw
        regexp: ^DEFAULT_FORWARD_POLICY=
        line: DEFAULT_FORWARD_POLICY="ACCEPT"
    - name: Aktiviere UFW
      ufw:
        state: enabled
        policy: deny
  handlers:
    - name: Reload UFW
      ufw:
        state: reloaded
