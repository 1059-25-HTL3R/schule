---
- name: Grundkonfiguration - IP-Adressen und Routen via Netplan
  hosts: 'R1, Client1, Client2, Client3'
  become: 'yes'
  tasks:
    - name: Konfiguriere Netplan auf R1
      when: inventory_hostname == 'R1'
      copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:  # Ansible-Interface
                dhcp4: false
                addresses: [192.168.100.129/24]
              ens39:  # Internet-Interfac
                dhcp4: yes
              ens37:  # Netz1
                dhcp4: false
                addresses: [192.168.1.254/24]
              ens38:  # Netz2
                dhcp4: false
                addresses: [192.168.2.254/24]
      notify: Apply Netplan
    - name: Aktiviere IP-Forwarding auf R1
      when: inventory_hostname == 'R1'
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: 'yes'
    - name: NAT-Regel für Internetzugang
      iptables:
        table: nat
        chain: POSTROUTING
        out_interface: ens39
        jump: MASQUERADE
        state: present
      become: yes
    - name: Konfiguriere Netplan auf Client1 (DHCP)
      when: inventory_hostname == 'Client1'
      copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:  # Ansible-Interface
                dhcp4: false
                addresses: [192.168.100.130/24]
              ens37:
                dhcp4: yes
      notify: Apply Netplan
    - name: Konfiguriere Netplan auf Client2 (statisch)
      when: inventory_hostname == 'Client2'
      copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:  # Ansible-Interface
                dhcp4: false
                addresses: [192.168.100.131/24]
              ens37:
                dhcp4: no
                addresses: [192.168.2.1/24]
                routes:
                  - to: default
                    via: 192.168.2.254
      notify: Apply Netplan
    - name: Konfiguriere Netplan auf Client3 (statisch)
      when: inventory_hostname == 'Client3'
      copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:  # Ansible-Interface
                dhcp4: false
                addresses: [192.168.100.132/24]
              ens37:
                dhcp4: false
                addresses: [192.168.2.2/24]
                routes:
                  - to: default
                    via: 192.168.2.254
    - name: Deaktiviere UFW
      community.general.ufw:
        state: disabled
      notify: Apply Netplan
  handlers:
    - name: Apply Netplan
      command: netplan apply
